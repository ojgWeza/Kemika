name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # No test step yet: `flutter test` fails with a nonzero exit code when the
      # `test/` directory has zero test files (not just a soft "no tests found"),
      # and this repo deliberately has no automated tests yet -- see CONSTITUTION.md
      # "Settled feature decisions". Re-add `flutter test` here as soon as the first
      # real test file exists.

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Build release APK
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release

      - name: Upload release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
